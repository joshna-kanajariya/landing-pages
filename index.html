    <script>
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        mobileMenuBtn?.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
        
        // Category filter functionality
        const categoryFilters = document.querySelectorAll('.category-filter');
        const courseCards = document.querySelectorAll('.course-card');
        
        categoryFilters.forEach(filter => {
            filter.addEventListener('click', () => {
                // Remove active class from all filters
                categoryFilters.forEach(f => {
                    f.classList.remove('active', 'bg-wisdom-purple', 'text-white');
                    f.classList.add('bg-white', 'text-gray-700', 'border-2', 'border-gray-200');
                });
                
                // Add active class to clicked filter
                filter.classList.add('active', 'bg-wisdom-purple', 'text-white');
                filter.classList.remove('bg-white', 'text-gray-700', 'border-2', 'border-gray-200');
                
                const category = filter.getAttribute('data-category');
                
                // Filter courses with animation
                courseCards.forEach(card => {
                    const cardCategory = card.getAttribute('data-category');
                    
                    if (category === 'all' || cardCategory === category) {
                        card.style.display = 'block';
                        card.style.opacity = '0';
                        card.style.transform = 'translateY(20px)';
                        
                        setTimeout(() => {
                            card.style.transition = 'all 0.3s ease';
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0)';
                        }, 100);
                    } else {
                        card.style.transition = 'all 0.3s ease';
                        card.style.opacity = '0';
                        card.style.transform = 'translateY(-20px)';
                        
                        setTimeout(() => {
                            card.style.display = 'none';
                        }, 300);
                    }
                });
            });
        });
        
        // Scroll-triggered animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    
                    // Add staggered animation for children if they exist
                    const children = entry.target.querySelectorAll('.instructor-card, .course-card');
                    children.forEach((child, index) => {
                        setTimeout(() => {
                            child.style.animation = 'slideUp 0.6s ease-out forwards';
                        }, index * 100);
                    });
                }
            });
        }, observerOptions);
        
        // Observe all animated elements
        document.querySelectorAll('.animated-element').forEach((el) => {
            observer.observe(el);
        });
        
        // Video player functionality
        const playButtons = document.querySelectorAll('.play-btn');
        playButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Create video modal simulation
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="bg-white rounded-lg p-8 max-w-2xl mx-4">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold">Course Preview</h3>
                            <button class="close-modal text-gray-500 hover:text-gray-700">
                                <i class="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        <div class="aspect-video bg-gradient-to-br from-wisdom-purple to-knowledge-blue rounded-lg flex items-center justify-center">
                            <div class="text-white text-center">
                                <i class="fas fa-play text-4xl mb-4"></i>
                                <p>Video preview would play here</p>
                            </div>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(modal);
                
                // Close modal functionality
                modal.querySelector('.close-modal').addEventListener('click', () => {
                    document.body.removeChild(modal);
                });
                
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        document.body.removeChild(modal);
                    }
                });
            });
        });
        
        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                    
                    // Close mobile menu if open
                    if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                        mobileMenu.classList.add('hidden');
                    }
                }
            });
        });
        
        // Add loading animation to buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                if (!this.classList.contains('loading')) {
                    const originalText = this.innerHTML;
                    this.classList.add('loading');
                    this.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Loading...';
                    
                    setTimeout(() => {
                        this.classList.remove('loading');
                        this.innerHTML = originalText;
                    }, 2000);
                }
            });
        });
        
        // Intersection Observer for progress bars
        const progressBars = document.querySelectorAll('[style*="--progress-width"]');
        const progressObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animation = 'progressFill 2s ease-out forwards';
                }
            });
        }, { threshold: 0.5 });
        
        progressBars.forEach(bar => {
            progressObserver.observe(bar);
        });
    </script>
